name: Scrape new VODs

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      startgg_full:
        description: Backfill start.gg for up to 5 hours (leave off for the daily scrape)
        type: boolean
        default: false
      startgg_batch:
        description: Max tournament names this run (time budget still stops around 5 hours)
        type: number
        default: 400

permissions:
  contents: write

concurrency:
  group: scrape-vods
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Scrape recent uploads
        if: ${{ github.event.inputs.startgg_full != 'true' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run scrape -- --recent --days 3 --enrich --limit 2500

      - name: Fill scores from start.gg
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: |
          if [ -z "$STARTGG_TOKEN" ]; then
            echo "STARTGG_TOKEN is empty. Add a repository secret named exactly STARTGG_TOKEN at"
            echo "https://github.com/rockminelaw/smash-theater/settings/secrets/actions"
            if [ "${{ github.event.inputs.startgg_full }}" = "true" ]; then
              exit 1
            fi
            echo "Skipping start.gg for the daily scrape."
            exit 0
          fi
          if [ "${{ github.event.inputs.startgg_full }}" = "true" ]; then
            BATCH="${{ github.event.inputs.startgg_batch }}"
            if [ -z "$BATCH" ] || [ "$BATCH" -lt 1 ]; then BATCH=400; fi
            npm run startgg -- --limit "$BATCH" --minutes 300
          else
            npm run startgg -- --recent --days 30 --limit 40
          fi

      - name: Commit archive if it changed
        if: always()
        run: |
          git add public/archive.json || true
          if [ -f data/startgg-state.json ]; then
            git add -f data/startgg-state.json
          fi
          if git diff --cached --quiet; then
            echo "No archive changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update VOD archive"
          git push
